  activeIncidents: Active incidents
  allSystemsOperational: All systems operational   # also in carvix-status.css (section 5)
  activeIncidentSummary: Opened $DATE
  incidentReport: See details
  scheduledMaintenance: Scheduled maintenance
  scheduledMaintenanceSummaryStarts: Starts $DATE · $DURATION min
  scheduledMaintenanceSummaryStarted: Started $DATE · $DURATION min
  liveStatus: Live status
  duration24H: 24h
  duration7D: 7d
  duration30D: 30d
  duration1Y: 1y
  durationAll: All
  overallUptime: "Uptime: $UPTIME"
  averageResponseTime: "Average response: $TIME ms"
  up: Up                                  # also in carvix-status.css (section 6)
  degraded: Slow                          # also in carvix-status.css (section 6)
  down: Down                              # also in carvix-status.css (section 6)
  ms: ms
  pastScheduledMaintenance: Past maintenance
  pastIncidents: Past incidents
  pastIncidentsResolved: Resolved · $MINUTES min
  loading: Loading…
  footer: "[carvix.com](https://www.carvix.com) · Design with ❤ from Miami, Florida"
  navGitHub: GitHub
  locale: en-US
  # Incident page
  incidentTitle: Incident $NUMBER · Carvix status
  incidentDetails: Incident details
  incidentOngoing: Ongoing
  incidentFixed: Resolved
  incidentScheduled: Scheduled
  incidentCompleted: Completed
  incidentOpenedAt: Opened
  incidentClosedAt: Resolved
  startedAt: Started
  startsAt: Starts
  duration: Duration
  durationMin: $DURATION minutes
  incidentCommentSummary: Posted $DATE
  incidentViewOnGitHub: View on GitHub    # hidden by carvix-status.css (section 7)
  incidentBack: ← Back to status
  # Site history page (/history/<site>)
  overallUptimeTitle: Uptime
  averageResponseTimeTitle: Average response
  sevelDayResponseTime: 7-day response time   # Upptime spells the key so
  responseTimeMs: Response time (ms)
  # Error and rate-limit pages
  errorTitle: Something went wrong
  errorIntro: We couldn’t load the latest status.
  errorText: Try again in a few moments.
  errorHome: Go to the status page
  rateLimitExceededTitle: Too many requests
  rateLimitExceededIntro: This page reads live data from GitHub, and your connection has reached GitHub’s limit for the hour. Please wait and try again, or add a GitHub token below.
  rateLimitExceededWhatDoesErrorMean: What does this mean?
  rateLimitExceededErrorMeaning: GitHub allows each connection a set number of requests an hour, and this page has used them.
  rateLimitExceededErrorHowCanFix: How can I fix it?
  rateLimitExceededErrorFix: Wait an hour and the limit resets. If you have a GitHub account, you can add a personal access token for more requests.
  rateLimitExceededGeneratePAT: How to create a personal access token
  rateLimitExceededHasSet: You have a personal access token set.
  rateLimitExceededRemoveToken: Remove token
  rateLimitExceededGitHubPAT: GitHub personal access token
  rateLimitExceededCopyPastePAT: Paste your token
  rateLimitExceededSaveToken: Save token
