# Design and created with ❤ by Carlos M. Hernandez
#
# Carvix status page and outside-AWS uptime checker (Upptime).
# Docs: https://upptime.js.org/docs/configuration
#
# Rule: only public, customer-facing endpoints. Never admin.carvixone.com,
# staff tools, or anything behind a sign-in.
#
# Paging: every downtime issue Upptime opens (labels `status` + the site
# slug) pages PagerDuty through .github/workflows/pagerduty.yml, and closing
# it resolves the incident. A new site is paged automatically.

owner: cmhdez
repo: carvix-status

sites:
  # The shopper website. Today carvix.com 308-redirects to www.carvix.com
  # (the current site, on Vercel); redirects are followed, so this stays
  # valid when the platform's web app takes over the apex at launch.
  # Name and icon per CX-00-20S (sites[0]); the slug stays `website` so the
  # history and graphs carry over.
  - name: Website (carvix.com)
    slug: website
    url: https://carvix.com
    icon: https://status.carvix.com/globe.svg

  # --- Not yet live: enable at production launch -------------------------
  # Commented out, not listed, because they fail today and every failure
  # pages PagerDuty (high urgency). Uncomment each one the day it serves.
  #
  # The platform API's liveness check (apps/api/src/health, the same path
  # the load balancer probes). api.carvix.com does not resolve yet.
  # - name: API
  #   slug: api
  #   url: https://api.carvix.com/health
  #   icon: https://status.carvix.com/server.svg
  #
  # The Help Center (apps/web /help). 404 on the current carvix.com site.
  # - name: Help Center
  #   slug: help-center
  #   url: https://carvix.com/help
  #   icon: https://status.carvix.com/life-buoy.svg

assignees:
  - cmhdez

# Keep every downtime issue, however short (Upptime otherwise deletes issues
# closed within 15 minutes). The PagerDuty bridge resolves on close, and the
# incident history stays complete.
skipDeleteIssues: true

# ===========================================================================
# STATUS WEBSITE: hosting (do not change without changing DNS)
# ===========================================================================
status-website:
  cname: status.carvix.com
  name: Carvix status                    # browser tab title

  # =========================================================================
  # STATUS WEBSITE: branding, per the master canvas boards CX-00-20 / 20B /
  # 20C and the implementation notes on CX-00-20S (D561).
  # Files in assets/ are copied to the SITE ROOT by the build, so
  # assets/carvix-status.css is served as /carvix-status.css.
  # =========================================================================
  logoUrl: https://status.carvix.com/carvix-wordmark.svg  # CAR ink + VIX red, both schemes inside the SVG
  logoHref: https://status.carvix.com/
  hideNavTitle: true                     # the wordmark is the name
  favicon: https://status.carvix.com/favicon-192.png
  faviconSvg: https://status.carvix.com/favicon.svg
  introTitle: Carvix status
  introMessage: See whether carvix.com, the Carvix API and the Help Center are working right now.

  # Upptime has no customCSS field. themeUrl REPLACES Upptime's light and
  # dark themes (the file carries both schemes). Upptime then loads its own
  # global.css AFTER the theme, so the same file is listed again in `links`
  # (which load after global.css) so its rules win the cascade.
  themeUrl: https://status.carvix.com/carvix-status.css
  links:
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@700&display=swap
    - rel: stylesheet
      href: https://status.carvix.com/carvix-status.css
  metaTags:
    - name: color-scheme
      content: light dark

  # =========================================================================
  # STATUS WEBSITE: navigation (owner: Status and carvix.com, no GitHub link)
  # Setting navbar drops Upptime's GitHub link.
  # =========================================================================
  navbar:
    - title: Status
      href: /
    - title: carvix.com
      href: https://www.carvix.com
      target: _blank

# ===========================================================================
# WORDS: every page string, English (CX-00-20S section 3). Top level, NOT
# under status-website. The Spanish site (es/ kit) takes the Spanish column.
# Upptime placeholders: $DATE, $DURATION, $MINUTES, $UPTIME, $TIME, $NUMBER.
# ===========================================================================
i18n:
