# Design and created with ❤ by Carlos M. Hernandez
#
# PagerDuty bridge for Upptime (Upptime has no PagerDuty notifier).
#
# What Upptime does (upptime/uptime-monitor v1.46.5, src/update.ts):
#   - site goes down     -> opens an issue titled "🛑 <name> is down",
#                           labels ["status", <site slug>, ...site tags]
#   - site is slow       -> opens "⚠️ <name> has degraded performance",
#                           same labels (one open issue per site at a time)
#   - site recovers      -> comments "Resolved: ..." and closes that issue
#   - closed < 15 min    -> deletes it, unless skipDeleteIssues (set: true)
# Maintenance issues carry the label "maintenance", never "status".
#
# This workflow: opened/reopened -> trigger, closed/deleted -> resolve.
# dedup_key = upptime-<issue number>: the same issue for the same outage from
# open to close, and a new number for the next outage.
#
# Upptime's own runs must use a GH_PAT or GitHub App token: issues opened with
# the built-in GITHUB_TOKEN do not start other workflows, so this would never run.
#
# Not regenerated by Upptime's update-template (it only rewrites its own
# eight workflow files).

name: PagerDuty bridge

on:
  issues:
    types: [opened, reopened, closed, deleted]

permissions: {}

concurrency:
  group: pagerduty-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  page:
    name: Send PagerDuty event
    # Upptime downtime issues only: the "status" label AND Upptime's exact
    # title shape. Expressions here are evaluated by Actions, not a shell.
    if: >-
      contains(github.event.issue.labels.*.name, 'status') &&
      !contains(github.event.issue.labels.*.name, 'maintenance') &&
      (
        (startsWith(github.event.issue.title, '🛑 ') && endsWith(github.event.issue.title, ' is down')) ||
        (startsWith(github.event.issue.title, '⚠️ ') && endsWith(github.event.issue.title, ' has degraded performance'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send event
        env:
          PAGERDUTY_ROUTING_KEY: ${{ secrets.PAGERDUTY_ROUTING_KEY }}
          ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${PAGERDUTY_ROUTING_KEY:-}" ]; then
            echo "::error::Secret PAGERDUTY_ROUTING_KEY is not set."
            exit 1
          fi

          case "$ACTION" in
            opened|reopened) EVENT_ACTION=trigger ;;
            closed|deleted)  EVENT_ACTION=resolve ;;
            *) echo "Ignoring action $ACTION"; exit 0 ;;
          esac

          case "$ISSUE_TITLE" in
            *" is down")
              SITE="${ISSUE_TITLE#🛑 }"; SITE="${SITE% is down}"
              SEVERITY=critical
              SUMMARY="$SITE is down (Upptime)" ;;
            *)
              SITE="${ISSUE_TITLE#⚠️ }"; SITE="${SITE% has degraded performance}"
              SEVERITY=warning
              SUMMARY="$SITE has degraded performance (Upptime)" ;;
          esac

          export EVENT_ACTION SEVERITY SUMMARY SITE
          export DEDUP_KEY="upptime-${ISSUE_NUMBER}"

          # Built from env only; the routing key never appears on a command
          # line or in the log.
          if [ "$EVENT_ACTION" = trigger ]; then
            PAYLOAD=$(jq -n '{
              routing_key: $ENV.PAGERDUTY_ROUTING_KEY,
              event_action: "trigger",
              dedup_key: $ENV.DEDUP_KEY,
              payload: {
                summary: $ENV.SUMMARY,
                source: "upptime",
                severity: $ENV.SEVERITY,
                component: $ENV.SITE,
                custom_details: {
                  issue: $ENV.ISSUE_URL,
                  repository: $ENV.REPOSITORY
                }
              },
              links: [{ href: $ENV.ISSUE_URL, text: "Upptime issue" }]
            }')
          else
            PAYLOAD=$(jq -n '{
              routing_key: $ENV.PAGERDUTY_ROUTING_KEY,
              event_action: "resolve",
              dedup_key: $ENV.DEDUP_KEY
            }')
          fi

          echo "Sending $EVENT_ACTION for $DEDUP_KEY ($SEVERITY)"
          printf '%s' "$PAYLOAD" | curl --silent --show-error --fail-with-body \
            --retry 5 --retry-all-errors --max-time 20 \
            -H 'Content-Type: application/json' \
            --data-binary @- \
            https://events.pagerduty.com/v2/enqueue \
            | jq '{status, message, dedup_key}'
